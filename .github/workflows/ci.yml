name: Basic Checks

on:
  push:
  pull_request:

jobs:
  basic-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: |
          python -m py_compile \
            train_catdog.py \
            scripts/benchmark_renode.py \
            scripts/build_chunked_submission_artifacts.py \
            scripts/export_eval_dataset.py \
            scripts/run_renode_full_uart.py \
            scripts/verify_benchmark_consistency.py

      - name: Verify benchmark artifacts
        run: |
          python scripts/verify_benchmark_consistency.py

      - name: Install RISC-V GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Firmware build
        run: |
          make -C firmware clean PREFIX=riscv64-unknown-elf-
          make -C firmware PREFIX=riscv64-unknown-elf-

      - name: Renode simulation note
        run: |
          echo "Renode simulation is not run in CI."
          echo "Run ./run_benchmark.sh locally when Renode, the RISC-V toolchain, and CIFAR-10 data are available."

name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile \
            train_catdog.py \
            scripts/benchmark_renode.py \
            scripts/build_chunked_submission_artifacts.py \
            scripts/export_eval_dataset.py \
            scripts/run_renode_full_uart.py \
            scripts/verify_benchmark_consistency.py

      - name: Verify benchmark artifacts
        run: |
          python scripts/verify_benchmark_consistency.py

      - name: Install RISC-V toolchain if available
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Firmware build
        run: |
          if command -v riscv32-unknown-elf-gcc >/dev/null 2>&1; then
            make -C firmware clean
            make -C firmware
          elif command -v riscv64-unknown-elf-gcc >/dev/null 2>&1; then
            make -C firmware clean PREFIX=riscv64-unknown-elf-
            make -C firmware PREFIX=riscv64-unknown-elf-
          else
            echo "RISC-V bare-metal GCC toolchain not available; skipping firmware build."
          fi

      - name: Renode note
        run: |
          echo "Renode simulation is not run in CI. Use run_benchmark.sh locally when Renode is installed."
